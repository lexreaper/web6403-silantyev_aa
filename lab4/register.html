<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>Game Zone — Регистрация</title>
        <link href="style.css" rel="stylesheet">

    </head>

    <body>
        <header class="header">
            <div class="container header__inner">
                <a class="header__logo" href="index.html">GAME <span> ZONE </span></a>
                <nav class="nav">
                    <a class="nav__link" href="index.html">Главная</a>
                    <a class="nav__link" href="games.html">Игры</a>
                    <a class="nav__link" href="about.html">О сайте</a>
                    <a class="nav__link nav__link--active" href="register.html">Регистрация</a>
                </nav>
            </div>
        </header>

        <main class="container section page">
            <section class="registration">
                <p class="eyebrow">GAME ZONE</p>
                <h1 class="page__title">Регистрация</h1>
                <p class="lead">
                    Заполните форму. При отправке данные обрабатываются JavaScript и информация выводится в консоль браузера.
                </p>
                <form class="registration__form" id="register-form">
                    <div class="registration__field">
                        <label class="registration__label" for="login">Логин</label>
                        <input class="registration__input" id="login" name="login" required type="text">
                    </div>

                    <div class="registration__field">
                        <label class="registration__label" for="password">Пароль</label>
                        <input class="registration__input" id="password" name="password" required type="password">
                    </div>
                    <label class="registration__checkbox-label">
                        <input id="agree" name="agree" required type="checkbox">
                        Согласен на обработку данных
                    </label>
                    <button class="button button--primary registration__submit" type="submit">Отправить данные</button>
                </form>
            </section>
        </main>

        <footer class="footer">
            Лабораторная работа №4 · Силантьев Александр · группа 6403
        </footer>
        <script src="script.js"></script>

    </body>
</html>
